[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "atmo3d"
version = "2.0.0"
description = "Interactive web viewer for 3D atmospheric data (CM1, WoFS, radar)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bobby Saba", email = "bobbysabawx@gmail.com" }]
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
# The app is the core plus every data-type package in packages/.  (For development, install
# each one editable: pip install -e packages/core -e packages/cm1 -e packages/wofs -e packages/radar.)
dependencies = ["atmo3d-core", "atmo3d-cm1", "atmo3d-wofs", "atmo3d-radar"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-xdist>=3.5", "websocket-client>=1.8"]
# MP4 export of animations: carries an ffmpeg binary. Not needed if ffmpeg is on PATH
# (e.g. module load ffmpeg); without either, animations save as GIF only.
video = ["imageio-ffmpeg>=0.5"]

[project.urls]
Homepage = "https://github.com/bobbysaba/atmo3d"

[tool.setuptools]
packages = []  # no code of its own: it only brings the packages together

[tool.pytest.ini_options]
testpaths = ["tests"]
# (the packages are imported from source: tests/conftest.py puts packages/*/src on sys.path)
addopts = "-m 'not real and not browser'"
markers = [
    "real: checks on your own CM1 run, ATMO3D_TEST_RUN=/path, WoFS root, ATMO3D_WOFS_ROOT=/path, or radar folder, ATMO3D_RADAR_ROOT=/path (slow; pytest -m real)",
    "browser: drives headless Firefox for screenshots (pytest -m browser)",
]
filterwarnings = [  # third-party noise only
    'ignore:numpy.ndarray size changed:RuntimeWarning',
    "ignore:'\\w+' deprecated - use:DeprecationWarning",
    'ignore:The (LATITUDE|LONGITUDE)_FORMATTER:DeprecationWarning',
]
