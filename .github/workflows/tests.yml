name: tests

# Path-filtered: a change to the core (or to anything shared) runs every test; a change
# only inside a data-type package runs that package's own tests.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.f.outputs.all }}
      cm1: ${{ steps.f.outputs.cm1 }}
      wofs: ${{ steps.f.outputs.wofs }}
      radar: ${{ steps.f.outputs.radar }}
      example: ${{ steps.f.outputs.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            all:
              - 'packages/core/**'
              - 'tests/core/**'
              - 'tests/conftest.py'
              - 'tests/synthetic.py'
              - 'tests/catalog_checks.py'
              - 'tests/synthetic_wofs.py'
              - 'tests/baseline/**'
              - 'pyproject.toml'
              - 'environment.yml'
              - '.github/workflows/tests.yml'
            cm1:
              - 'packages/cm1/**'
              - 'tests/cm1/**'
            wofs:
              - 'packages/wofs/**'
              - 'tests/wofs/**'
            radar:
              - 'packages/radar/**'
              - 'tests/radar/**'
              - 'tests/synthetic_radar.py'
            example:
              - 'packages/example/**'
              - 'tests/example/**'
              - 'tools/new_datatype.py'

  test:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.cm1 == 'true' || needs.changes.outputs.wofs == 'true' || needs.changes.outputs.radar == 'true' || needs.changes.outputs.example == 'true'
    # atmo3d runs on clusters (Linux) and on people's own machines: every OS, each to
    # the end (one failing does not cancel the others)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # 3D scenes render with VTK, which needs OpenGL: the runners have no display, and
      # VTK crashes (a segfault) without one.  (Xvfb and Mesa on Linux, Mesa on Windows.)
      - uses: pyvista/setup-headless-display-action@v5
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: atmo3d
          conda-remove-defaults: true
      # (not packages/example: it is no part of the app; its tests register it themselves)
      - name: Install the packages (editable)
        shell: bash -el {0}
        run: pip install --no-deps -e packages/core -e packages/cm1 -e packages/wofs -e packages/radar
      - name: Pick the tests
        id: pick
        shell: bash
        run: |
          if [ "${{ needs.changes.outputs.all }}" = "true" ]; then
            echo "paths=tests" >> "$GITHUB_OUTPUT"
          else
            p=""
            [ "${{ needs.changes.outputs.cm1 }}" = "true" ] && p="$p tests/cm1"
            [ "${{ needs.changes.outputs.wofs }}" = "true" ] && p="$p tests/wofs"
            [ "${{ needs.changes.outputs.radar }}" = "true" ] && p="$p tests/radar"
            [ "${{ needs.changes.outputs.example }}" = "true" ] && p="$p tests/example"
            echo "paths=$p" >> "$GITHUB_OUTPUT"
          fi
      - name: pytest
        shell: bash -el {0}
        run: pytest ${{ steps.pick.outputs.paths }} -q -n auto
