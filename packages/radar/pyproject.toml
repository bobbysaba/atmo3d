[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "atmo3d-radar"
version = "2.2.0"
description = "atmo3d data type: radar volumes (CfRadial, NEXRAD Level II), in native polar geometry"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bobby Saba", email = "bobbysabawx@gmail.com" }]
license = { text = "GPL-3.0-or-later" }
dependencies = ["atmo3d-core", "netCDF4>=1.7", "numpy>=1.26", "scipy>=1.13"]

[project.scripts]
atmo3d-nexrad = "atmo3d_radar.aws:main"

[project.entry-points."atmo3d.datatypes"]
radar = "atmo3d_radar:register"

[tool.setuptools.packages.find]
where = ["src"]
