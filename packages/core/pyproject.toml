[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "atmo3d-core"
version = "2.1.0"
description = "atmo3d core: the data-agnostic viewer, figures, and the data-type registry"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bobby Saba", email = "bobbysabawx@gmail.com" }]
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
# environment.yml pins the versions atmo3d is tested with (conda-forge); these are the
# looser requirements for a pip install into an existing environment.
dependencies = [
    "panel>=1.7,<2",
    "bokeh>=3.7,<4",
    "param>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "xarray>=2024.6",
    "netCDF4>=1.7",
    "matplotlib>=3.9",
    "contourpy>=1.3",
    "metpy>=1.6",
    "pyproj>=3.6",
    "numba>=0.60",
    "scikit-image>=0.24",
    "pillow>=10",
    "plotly>=5.24,<6",
    "pyvista>=0.44",
    "cmocean>=3.0",
    "cmweather>=0.3",
]

[project.optional-dependencies]
# MP4 export of animations: carries an ffmpeg binary. Not needed if ffmpeg is on PATH
# (e.g. module load ffmpeg); without either, animations save as GIF only.
video = ["imageio-ffmpeg>=0.5"]

[project.urls]
Homepage = "https://github.com/bobbysaba/atmo3d"

[project.scripts]
atmo3d = "atmo3d.__main__:main"

# Data types register here: each package names its Model class in this group
# (see docs/developing.md).  atmo3d reads the group at start-up.
[project.entry-points."atmo3d.datatypes"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["atmo3d*"]

[tool.setuptools.package-data]
# map boundary lines (core.geo; built by tools/make_boundaries.py)
atmo3d = ["data/*.npz"]
